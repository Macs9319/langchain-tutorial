<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedalwise Staff</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e2e2dc; --ok:#1f8a4c; --no:#c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ededea; --muted:#9a9a93; --card:#222220; --line:#33332f; --ok:#3fb06f; --no:#f07a45; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  input, button { font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); padding:8px 12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .row input { flex:1; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .meta { color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .approve { background:var(--ok); color:#fff; border:0; }
  .reject { background:var(--no); color:#fff; border:0; }
  #status { color:var(--muted); font-size:14px; }
  [hidden] { display:none !important; }
  h2 { font-size:16px; margin:24px 0 8px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:8px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .stat b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>Refunds waiting for approval</h1>
  <div class="row">
    <form id="login" class="row" style="width:100%" hidden>
      <input id="email" type="email" autocomplete="username" placeholder="Staff email" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button>Log in</button>
    </form>
    <span id="who" class="meta" hidden></span>
    <button id="logout" type="button" hidden>Log out</button>
  </div>
  <div id="status">Log in with a staff account to see the queue.</div>
  <div id="queue"></div>
  <h2>Last 24 hours</h2>
  <div class="stats" id="stats"></div>
  <div class="meta" id="tools"></div>
  <h2>Recent thumbs-down</h2>
  <div id="negative"><div class="meta">None yet.</div></div>
</main>
<script>
const queue = document.getElementById("queue"), status = document.getElementById("status");
// Staff log in like customers do; their session's CSRF token goes with every
// change (Tutorial 27). The audit log records which staff member decided.
let csrf = null, shownQueue = null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

async function api(path, options = {}) {
  const response = await fetch(path, {...options,
    headers: {"content-type": "application/json", "X-CSRF-Token": csrf || "",
              ...(options.headers || {})}});
  if (response.status === 401) { showLogin(); throw new Error("Please log in"); }
  if (response.status === 403) throw new Error("This account isn't a staff account");
  if (!response.ok) throw new Error("Request failed: " + response.status);
  return response.json();
}

async function refresh() {
  if (!csrf) return;
  try {
    const items = await api("/api/staff/approvals");
    // Rebuild only when the queue changed, so a note being typed isn't wiped.
    const key = items.map(i => i.thread_id).join(",");
    if (key === shownQueue) return;
    shownQueue = key;
    queue.replaceChildren();
    status.textContent = items.length ? "" : "Nothing waiting. This list refreshes every 5 seconds.";
    for (const item of items) {
      const card = el("div", "card");
      for (const action of item.actions) {
        card.append(el("div", "", `${action.name}: order ${action.args.order_id}`));
        if (action.args.reason) card.append(el("div", "meta", "Reason: " + action.args.reason));
      }
      card.append(el("div", "meta", `Customer: ${item.customer} · conversation ${item.thread_id}`));
      const note = el("input"); note.placeholder = "Note to customer if rejecting (optional)";
      const yes = el("button", "approve", "Approve"), no = el("button", "reject", "Reject");
      const decide = async (approve) => {
        yes.disabled = no.disabled = true;
        try {
          const result = await api(`/api/staff/approvals/${item.thread_id}`,
            {method: "POST", body: JSON.stringify({approve, note: note.value || null})});
          card.replaceChildren(el("div", "meta", "Done. Assistant replied: " + result.reply));
        } catch (err) { status.textContent = err.message; yes.disabled = no.disabled = false; }
      };
      yes.onclick = () => decide(true); no.onclick = () => decide(false);
      const actions = el("div", "actions"); actions.append(note, yes, no); card.append(actions);
      queue.append(card);
    }
  } catch (err) { status.textContent = err.message; }
}

// Metrics (Tutorial 22): what customers experienced, from the runs table.
async function refreshMetrics() {
  if (!csrf) return;
  let m;
  try { m = await api("/api/staff/metrics?hours=24"); } catch { return; }
  const ms = v => v == null ? "–" : v >= 1000 ? (v / 1000).toFixed(1) + " s" : v + " ms";
  const stats = [
    [m.runs, "runs"],
    [(m.error_rate * 100).toFixed(1) + "%", "errors and timeouts"],
    [ms(m.latency_ms.p50), "typical reply (p50)"],
    [ms(m.latency_ms.p95), "slow replies (p95)"],
    [m.model_calls_per_run, "model calls per run"],
    [(m.tokens.input + m.tokens.output).toLocaleString(), "tokens"],
    [`👍 ${m.feedback.up} · 👎 ${m.feedback.down}`, `${Math.round(m.feedback.rated_share * 100)}% of runs rated`],
  ];
  document.getElementById("stats").replaceChildren(...stats.map(([value, label]) => {
    const card = el("div", "stat"); card.append(el("b", "", String(value)), el("span", "", label)); return card;
  }));
  const tools = Object.entries(m.tools).map(([name, n]) => `${name} ×${n}`).join(", ");
  document.getElementById("tools").textContent = "Tools used: " + (tools || "none") +
    (m.tool_errors ? ` · ${m.tool_errors} tool errors` : "");
  const negative = document.getElementById("negative");
  if (!m.negative_feedback.length) { negative.replaceChildren(el("div", "meta", "None yet.")); return; }
  negative.replaceChildren(...m.negative_feedback.map(item => {
    const card = el("div", "card");
    card.append(el("div", "", "Q: " + (item.question || "(staff decision)")),
                el("div", "meta", "A: " + (item.answer || "(no answer)")));
    if (item.comment) card.append(el("div", "", "Customer said: " + item.comment));
    card.append(el("div", "meta", `${item.created} UTC · run ${item.run_id}`));
    return card;
  }));
}

function showStaff(user) {
  csrf = user.csrf_token; shownQueue = null;
  document.getElementById("login").hidden = true;
  const who = document.getElementById("who");
  who.textContent = `Logged in as ${user.name} (${user.email})`; who.hidden = false;
  document.getElementById("logout").hidden = false;
  status.textContent = "";
  refresh(); refreshMetrics();
}

function showLogin(message) {
  csrf = null;
  document.getElementById("login").hidden = false;
  document.getElementById("who").hidden = true;
  document.getElementById("logout").hidden = true;
  queue.replaceChildren();
  status.textContent = message || "Log in with a staff account to see the queue.";
}

document.getElementById("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const response = await fetch("/api/login", {method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({email: document.getElementById("email").value,
                          password: document.getElementById("password").value})});
  document.getElementById("password").value = "";
  const body = await response.json().catch(() => ({}));
  if (!response.ok) return showLogin(body.detail || "Couldn't log in.");
  if (body.role !== "staff") return showLogin("That's a customer account, not a staff account.");
  showStaff(body);
});

document.getElementById("logout").addEventListener("click", async () => {
  await fetch("/api/logout", {method: "POST", headers: {"X-CSRF-Token": csrf || ""}});
  showLogin();
});

(async () => {  // already logged in?
  const response = await fetch("/api/me");
  const user = response.ok ? await response.json() : null;
  if (user && user.role === "staff") showStaff(user); else showLogin();
})();
setInterval(refresh, 5000);
setInterval(refreshMetrics, 30000);
</script>
</body>
</html>
