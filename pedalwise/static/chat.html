<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedalwise Support</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --me:#dbe8ff; --bot:#fff; --line:#e2e2dc; --accent:#2f6fde; --warn:#fff4d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ededea; --muted:#9a9a93; --me:#23344f; --bot:#222220; --line:#33332f; --warn:#3a3218; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:680px; margin:0 auto; padding:16px; display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; flex:1; }
  select, input, button { font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--bot); color:var(--fg); padding:8px 12px; }
  button.primary { background:var(--accent); color:#fff; border:0; }
  button:disabled, input:disabled { opacity:.5; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 12px; border-radius:12px; max-width:85%; white-space:pre-wrap; border:1px solid var(--line); }
  .me { background:var(--me); align-self:flex-end; }
  .bot { background:var(--bot); align-self:flex-start; }
  .status { color:var(--muted); font-size:13px; }
  .waiting { background:var(--warn); border-radius:10px; padding:8px 12px; font-size:14px; }
  .feedback { display:flex; gap:6px; align-items:center; flex-wrap:wrap; align-self:flex-start; font-size:13px; color:var(--muted); }
  .feedback button { padding:2px 8px; border-radius:8px; }
  .feedback button[aria-pressed="true"] { border-color:var(--accent); background:var(--me); }
  .feedback input { padding:4px 8px; font-size:13px; min-width:0; flex:1; }
  form { display:flex; gap:8px; margin-top:12px; }
  form input { flex:1; min-width:0; }
  #login { flex-direction:column; max-width:360px; width:100%; margin:48px auto 0; }
  #login p { margin:0; color:var(--muted); font-size:14px; }
  #who { color:var(--muted); font-size:14px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pedalwise Bikes support</h1>
    <span id="who"></span>
    <button id="new" type="button" hidden>New chat</button>
    <button id="logout" type="button" hidden>Log out</button>
  </header>
  <form id="login" hidden>
    <p>Log in to see your orders and chat with support.</p>
    <input id="email" type="email" autocomplete="username" placeholder="Email" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="primary">Log in</button>
    <p id="login-error" role="alert"></p>
  </form>
  <div id="log" hidden></div>
  <form id="form" hidden>
    <input id="text" autocomplete="off" placeholder="Ask about orders, stock, parts or policies" required>
    <button class="primary" id="send">Send</button>
  </form>
</main>
<script>
const log = document.getElementById("log");
const input = document.getElementById("text");
const send = document.getElementById("send");
let threadId = null, polling = null;
// The CSRF token from the login response (Tutorial 27). The session cookie
// itself is HttpOnly, so this script never sees it; it sends this token in a
// header instead, which another site can't do.
let csrf = null;

function post(path, body) {
  return fetch(path, {method: "POST", body: JSON.stringify(body),
    headers: {"content-type": "application/json", "X-CSRF-Token": csrf}});
}

function showChat(user) {
  csrf = user.csrf_token;
  document.getElementById("who").textContent = `Logged in as ${user.name}`;
  for (const id of ["log", "form", "new", "logout"]) document.getElementById(id).hidden = false;
  document.getElementById("login").hidden = true;
  if (user.role === "staff") add("status", "This is a staff account: the staff page is at /staff.");
  reset();
}

function showLogin(message = "") {
  csrf = null; clearInterval(polling);
  document.getElementById("who").textContent = "";
  for (const id of ["log", "form", "new", "logout"]) document.getElementById(id).hidden = true;
  document.getElementById("login").hidden = false;
  document.getElementById("login-error").textContent = message;
  document.getElementById("email").focus();
}

// Already logged in (the cookie survives reloads)? Otherwise show the form.
async function checkSession() {
  const response = await fetch("/api/me");
  if (response.ok) showChat(await response.json()); else showLogin();
}

document.getElementById("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const response = await fetch("/api/login", {method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({email: document.getElementById("email").value,
                          password: document.getElementById("password").value})});
  document.getElementById("password").value = "";
  if (response.ok) showChat(await response.json());
  else showLogin((await response.json().catch(() => ({}))).detail || "Couldn't log in.");
});

document.getElementById("logout").addEventListener("click", async () => {
  await post("/api/logout", {});
  showLogin();
});

// textContent everywhere: model output is never inserted as HTML.
function add(cls, text) {
  const div = document.createElement("div");
  div.className = cls; div.textContent = text;
  log.appendChild(div); log.scrollTop = log.scrollHeight; return div;
}
function setBusy(busy) { input.disabled = busy; send.disabled = busy; if (!busy) input.focus(); }
function reset() {
  threadId = null; clearInterval(polling); log.replaceChildren(); setBusy(false);
  add("status", 'Try: "What are my orders?", "Do PW-BRK-230 pads fit the City e-bike?" ' +
                'or "Can I return my Trail 500?"');
}


// Thumbs up/down under an answer (Tutorial 22). The run id ties the vote to
// exactly this answer, and to its trace in LangSmith if tracing is on.
function addFeedback(runId) {
  const row = document.createElement("div"); row.className = "feedback";
  const up = document.createElement("button"), down = document.createElement("button");
  up.type = down.type = "button";
  up.textContent = "👍"; up.setAttribute("aria-label", "Helpful");
  down.textContent = "👎"; down.setAttribute("aria-label", "Not helpful");
  const thanks = document.createElement("span");
  async function vote(score, comment = null) {
    const response = await post("/api/feedback", {run_id: runId, score, comment});
    up.setAttribute("aria-pressed", score === 1); down.setAttribute("aria-pressed", score === -1);
    thanks.textContent = response.ok ? "Thanks for the feedback." : "Couldn't save that.";
  }
  up.onclick = () => { row.querySelector("form")?.remove(); vote(1); };
  down.onclick = () => {
    vote(-1);
    if (row.querySelector("form")) return;
    // Ask what was wrong: the comment is what turns a thumbs-down into a test case.
    const form = document.createElement("form"), note = document.createElement("input");
    const sendNote = document.createElement("button");
    note.placeholder = "What was wrong? (optional)"; note.maxLength = 1000; sendNote.textContent = "Send";
    form.style.margin = "0"; form.append(note, sendNote);
    form.onsubmit = (e) => { e.preventDefault(); vote(-1, note.value.trim() || null); form.remove(); };
    row.append(form); note.focus();
  };
  row.append(up, down, thanks);
  log.appendChild(row); log.scrollTop = log.scrollHeight;
}

// After a refund request, check every few seconds whether staff have decided.
function waitForApproval() {
  const note = add("waiting", "A staff member is reviewing your refund request. " +
                              "You can keep this page open.");
  setBusy(true);
  polling = setInterval(async () => {
    const response = await fetch(`/api/threads/${threadId}`);
    if (!response.ok) return;
    const thread = await response.json();
    if (!thread.pending) {
      clearInterval(polling); note.remove();
      const last = thread.messages[thread.messages.length - 1];
      if (last && last.role === "ai") add("msg bot", last.text);
      setBusy(false);
    }
  }, 3000);
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim(); if (!message) return;
  input.value = ""; setBusy(true); add("msg me", message);
  let reply = null, pending = false, runId = null, answered = false;
  try {
    const response = await post("/api/chat", {message, thread_id: threadId});
    if (response.status === 401) { showLogin("Your session ended. Please log in again."); return; }
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      add("status", "⚠ " + (err.detail || response.status)); return;
    }
    // Read the Server-Sent Events stream (same parser as Tutorial 12).
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buffer += value;
      const blocks = buffer.split("\n\n"); buffer = blocks.pop();
      for (const block of blocks) {
        let event = "message", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        const payload = data ? JSON.parse(data) : {};
        if (event === "thread") threadId = payload.thread_id;
        else if (event === "run") runId = payload.run_id;
        else if (event === "token") { reply = reply || add("msg bot", ""); reply.textContent += payload.text; answered = true; }
        else if (event === "status") { add("status", payload.text); reply = null; }
        else if (event === "approval_pending") pending = true;
        else if (event === "error") add("status", "⚠ " + payload.message);
      }
    }
  } catch (err) { add("status", "Connection error: " + err.message); }
  finally {
    if (answered && runId) addFeedback(runId);
    if (pending) waitForApproval(); else setBusy(false);
  }
});

document.getElementById("new").addEventListener("click", reset);
checkSession();
</script>
</body>
</html>
