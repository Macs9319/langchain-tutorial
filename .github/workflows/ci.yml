# Tutorial 21: check every push and pull request automatically.
# Nothing here calls OpenAI, so it needs no API key and costs nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres, to run the same tests on it (Tutorial 26).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pedalwise
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pedalwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pedalwise"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --locked: fail if uv.lock doesn't match pyproject.toml.
      - run: uv sync --locked
      # Every tutorial must at least parse. LangChain moves fast, and this
      # catches a broken file before a reader does.
      - run: uv run python -m py_compile *.py pedalwise/*.py mcp_servers/*.py
      # The capstone's tests use a scripted model and offline embeddings.
      - run: uv run pytest -q
      # Backups on Postgres (Tutorial 29) need pg_dump 18, like the server;
      # the runner's own is older.
      - name: install the Postgres 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
      # The same tests again on Postgres: each gets its own fresh database.
      - name: tests on Postgres
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://pedalwise:ci@localhost:5432/pedalwise

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Builds the image the way it would be deployed, so a broken
      # Dockerfile fails here instead of during a release.
      - run: docker build -t pedalwise .
      # And the backup image (Tutorial 29), which adds the Postgres client.
      - run: docker build --target backup -t pedalwise-backup .
