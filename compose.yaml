# Tutorial 21: run the Pedalwise app the way it runs in production.
#
#   docker compose up --build      start (add -d to run in the background)
#   docker compose logs -f         follow the JSON logs
#   docker compose down            stop; the data volume is kept
#   docker compose down -v         stop and delete the data too

services:
  pedalwise:
    build: .
    # Published on 127.0.0.1 only: the demo has no real logins, so anyone who
    # could reach it could spend your OpenAI credits. Put real authentication
    # in front before opening it to a network.
    ports:
      - "127.0.0.1:8001:8001"
    # OPENAI_API_KEY and STAFF_TOKEN come from your .env, at run time.
    env_file: .env
    environment:
      PEDALWISE_DEMO_PASSWORD: ${PEDALWISE_DEMO_PASSWORD:-}  # demo accounts (Tutorial 27)
      # Plain http on 127.0.0.1. Behind HTTPS, remove this so cookies are Secure.
      COOKIE_SECURE: "false"
    volumes:
      - pedalwise-data:/var/lib/pedalwise
    restart: unless-stopped

  # Tutorial 29: a backup every 24 hours, checked by restoring it to a
  # scratch copy, keeping the newest 7. Its own volume, so deleting the data
  # volume doesn't take the backups with it. (A real setup also copies them
  # off this machine: a backup on the same disk dies with that disk.)
  #   docker compose exec backup python 29_backups.py --list
  #   docker compose exec backup python 29_backups.py --backup
  #   docker compose cp backup:/var/lib/pedalwise-backups ./backups    # copy them out
  # Restore: stop the app, restore, start it again:
  #   docker compose stop pedalwise
  #   docker compose exec backup python 29_backups.py --restore NAME
  #   docker compose start pedalwise
  backup:
    build: .
    command: ["python", "29_backups.py", "--every", "24h", "--keep", "7"]
    volumes:
      - pedalwise-data:/var/lib/pedalwise  # reads the app's SQLite file (and restores it)
      - pedalwise-backups:/var/lib/pedalwise-backups
    healthcheck:
      disable: true  # the image's check asks the app's /readyz
    depends_on:
      pedalwise:
        condition: service_healthy  # the database exists by then
    restart: unless-stopped

volumes:
  pedalwise-data:
  pedalwise-backups:
