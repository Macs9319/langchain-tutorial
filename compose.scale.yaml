# Tutorial 26: the Pedalwise app scaled out.
#
#   Caddy (load balancer, 127.0.0.1:8080)
#     ├─► pedalwise copy 1 ─┐
#     └─► pedalwise copy 2 ─┴─► Postgres (conversations, approvals,
#                                         refunds, telemetry)
#
#   docker compose -f compose.scale.yaml up --build
#   uv run 26_scaling.py --check http://127.0.0.1:8080
#   docker compose -f compose.scale.yaml up -d --scale pedalwise=3   # more copies
#   docker compose -f compose.scale.yaml down        # keep the data
#   docker compose -f compose.scale.yaml down -v     # delete it too

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pedalwise
      POSTGRES_DB: pedalwise
      # Not published outside this compose network. For anything real, set
      # POSTGRES_PASSWORD in .env instead of relying on this default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pedalwise-local}
    volumes:
      - pedalwise-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pedalwise"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Schema migrations run once, before any copy starts (Tutorial 28). With
  # several copies, migrating at startup would mean every copy racing to do
  # it (the lock makes that safe, but slow and noisy), and copies running
  # against a schema they weren't written for.
  migrate:
    build: .
    command: ["python", "28_migrations.py", "--upgrade"]
    environment:
      DATABASE_URL: postgresql://pedalwise:${POSTGRES_PASSWORD:-pedalwise-local}@postgres:5432/pedalwise
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  pedalwise:
    build: .
    deploy:
      replicas: 2
    # No ports here: only Caddy is reachable from outside.
    env_file: .env  # OPENAI/DEEPSEEK keys and STAFF_TOKEN: every copy needs the same
    environment:
      DATABASE_URL: postgresql://pedalwise:${POSTGRES_PASSWORD:-pedalwise-local}@postgres:5432/pedalwise
      # The search index is a cache each copy builds for itself on start.
      PEDALWISE_INDEX_DIR: /tmp/rag_index
      # Logins (Tutorial 27): demo accounts' password, from your .env.
      PEDALWISE_DEMO_PASSWORD: ${PEDALWISE_DEMO_PASSWORD:-}
      # Only Caddy can reach these copies, so trust its X-Forwarded-For: the
      # login throttle must see each visitor's address, not Caddy's.
      FORWARDED_ALLOW_IPS: "*"
      # This stack is plain http on 127.0.0.1. With HTTPS in front (Caddy
      # does it automatically for a real domain), remove this line.
      COOKIE_SECURE: "false"
      # The migrate service did it; refuse to start if the schema is behind.
      MIGRATE_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - pedalwise
    restart: unless-stopped

volumes:
  pedalwise-pg:
